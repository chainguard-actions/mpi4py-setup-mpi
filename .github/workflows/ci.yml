name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        mpi:
          - mpich
          - openmpi
          - intelmpi
          - msmpi
        os:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - macos-15
          - macos-14
          - macos-15-intel
          - windows-2025
          - windows-2022
        exclude:
          - os: ubuntu-24.04
            mpi: msmpi
          - os: ubuntu-22.04
            mpi: msmpi
          - os: ubuntu-24.04-arm
            mpi: intelmpi
          - os: ubuntu-22.04-arm
            mpi: intelmpi
          - os: ubuntu-24.04-arm
            mpi: msmpi
          - os: ubuntu-22.04-arm
            mpi: msmpi
          - os: macos-15
            mpi: intelmpi
          - os: macos-15
            mpi: msmpi
          - os: macos-14
            mpi: intelmpi
          - os: macos-14
            mpi: msmpi
          - os: macos-15-intel
            mpi: intelmpi
          - os: macos-15-intel
            mpi: msmpi
          - os: windows-2025
            mpi: mpich
          - os: windows-2025
            mpi: openmpi
          - os: windows-2022
            mpi: mpich
          - os: windows-2022
            mpi: openmpi

    steps:

    - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup MPI
      id:   setup-mpi
      uses: ./
      with:
        mpi: ${{ matrix.mpi }}

    - name: Show MPI name
      env:
        SETUP_MPI_OUTPUT: ${{ steps.setup-mpi.outputs.mpi }}
      run:  echo "$SETUP_MPI_OUTPUT"

    - name: Show MPI info
      run:  mpichversion
      if:   ${{ matrix.mpi == 'mpich' }}

    - name: Show MPI info
      run:  ompi_info
      if:   ${{ matrix.mpi == 'openmpi' }}

    - name: Show MPI info
      run:  impi_info
      if:   ${{ matrix.mpi == 'intelmpi' }}

    - name: Show MPI info
      run: |
        Write-Host MSMPI_BIN=$Env:MSMPI_BIN
        Write-Host MSMPI_INC=$Env:MSMPI_INC
        Write-Host MSMPI_LIB32=$Env:MSMPI_LIB32
        Write-Host MSMPI_LIB64=$Env:MSMPI_LIB64
      if:   ${{ matrix.mpi == 'msmpi' }}

    - name: Show MPI compiler wrappers
      run: |
        command -v mpicc
        mpicc -show

        command -v mpicxx
        mpicxx -show

        mpifort=$(command -v mpifort || command -v mpifc)
        command -v $mpifort
        $mpifort -show
      if: ${{ runner.os != 'Windows' }}

    - name: Show MPI compiler wrappers
      run: |
        mpicc -show
        mpicxx -show
      if: ${{ runner.os == 'Windows' && matrix.mpi == 'intelmpi' }}

    - name: Help MPI executor
      run: |
        command -v mpiexec
        mpiexec --help
      if: ${{ runner.os != 'Windows' }}

    - name: Help MPI executor
      run: |
        mpiexec -help
      if: ${{ runner.os == 'Windows' && matrix.mpi == 'intelmpi' }}

    - name: Help MPI executor
      run: |
        mpiexec /help2
        mpiexec /help3
      if: ${{ runner.os == 'Windows' && matrix.mpi == 'msmpi' }}

    - name: Build MPI application
      run:  mpicc helloworld.c -o helloworld.exe
      if: ${{ runner.os != 'Windows' }}

    - name: Execute MPI application
      run:  mpiexec -n 5 ./helloworld.exe
      if: ${{ runner.os != 'Windows' }}

  Linux:
    runs-on: ubuntu-latest
    steps:

    - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup MPICH
      id:   setup1
      uses: ./
      with:
        mpi: mpich
    - env:
        SETUP1_MPI: ${{ steps.setup1.outputs.mpi }}
      run: test "$SETUP1_MPI" == mpich
    - run: command -v mpichversion

    - name: Setup Open MPI
      id:   setup2
      uses: ./
      with:
        mpi: openmpi
    - env:
        SETUP2_MPI: ${{ steps.setup2.outputs.mpi }}
      run: test "$SETUP2_MPI" == openmpi
    - run: command -v ompi_info

    - name: Setup Intel MPI
      id:   setup3
      uses: ./
      with:
        mpi: intelmpi
    - env:
        SETUP3_MPI: ${{ steps.setup3.outputs.mpi }}
      run: test "$SETUP3_MPI" == intelmpi
    - run: command -v impi_info

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu
    container: ${{ matrix.image }}
    steps:

    - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup MPICH
      id:   setup1
      uses: ./
      with:
        mpi: mpich
    - env:
        SETUP1_MPI: ${{ steps.setup1.outputs.mpi }}
      run: test "$SETUP1_MPI" = mpich
    - run: command -v mpichversion

    - name: Setup Open MPI
      id:   setup2
      uses: ./
      with:
        mpi: openmpi
    - env:
        SETUP2_MPI: ${{ steps.setup2.outputs.mpi }}
      run: test "$SETUP2_MPI" = openmpi
    - run: command -v ompi_info

    - name: Setup Intel MPI
      id:   setup3
      uses: ./
      with:
        mpi: intelmpi
    - env:
        SETUP3_MPI: ${{ steps.setup3.outputs.mpi }}
      run: test "$SETUP3_MPI" = intelmpi
    - run: command -v impi_info

  macOS:
    runs-on: macos-latest
    steps:

    - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup MPICH
      id:   setup1
      uses: ./
      with:
        mpi: mpich
    - env:
        SETUP1_MPI: ${{ steps.setup1.outputs.mpi }}
      run: test "$SETUP1_MPI" == mpich
    - run: command -v mpichversion

    - name: Setup Open MPI
      id:   setup2
      uses: ./
      with:
        mpi: open-mpi
    - env:
        SETUP2_MPI: ${{ steps.setup2.outputs.mpi }}
      run: test "$SETUP2_MPI" == openmpi
    - run: command -v ompi_info

    - name: Unlink Homebrew MPI formulae
      run:  brew unlink mpich openmpi

    - name: Setup MPICH
      id:   setup3
      uses: ./
      with:
        mpi: mpich
    - env:
        SETUP3_MPI: ${{ steps.setup3.outputs.mpi }}
      run: test "$SETUP3_MPI" == mpich
    - run: command -v mpichversion

    - name: Setup Open MPI
      id:   setup4
      uses: ./
      with:
        mpi: ompi
    - env:
        SETUP4_MPI: ${{ steps.setup4.outputs.mpi }}
      run: test "$SETUP4_MPI" == openmpi
    - run: command -v ompi_info

  Windows:
    runs-on: windows-latest
    steps:

    - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup Intel MPI
      id:   setup1
      uses: ./
      with:
        mpi: intel

    - name: Setup Microsoft MPI
      id:   setup2
      uses: ./
      with:
        mpi: microsoft

    - env:
        SETUP1_MPI: ${{ steps.setup1.outputs.mpi }}
      run: test "$SETUP1_MPI" == intelmpi
    - env:
        SETUP2_MPI: ${{ steps.setup2.outputs.mpi }}
      run: test "$SETUP2_MPI" == msmpi

  ci-status:
    runs-on: ubuntu-latest
    if: ${{ success() || failure() }}
    needs:
      - test
      - Linux
      - container
      - macOS
      - Windows
    steps:
    - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
    - name: Check overall CI status
      env:
        NEEDS_RESULT: ${{ contains(needs.*.result, 'failure') }}
      run: |
        if [ "$NEEDS_RESULT" = "true" ]; then
          echo "One or more jobs failed"
          exit 1
        fi
        echo "All jobs passed"
