name: Test default MPI (mpich on Linux)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-mpi
        uses: .
      - name: Assert output mpi equals mpich
        env:
          ACTUAL: ${{ steps.setup-mpi.outputs.mpi }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "mpich" ]; then
            echo "FAIL: expected 'mpich' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert mpiexec is available
        run: |
          which mpiexec || { echo "FAIL: mpiexec not found on PATH"; exit 1; }
          echo "PASS: mpiexec found at $(which mpiexec)"
      - name: Assert mpichversion runs
        run: |
          mpichversion || { echo "FAIL: mpichversion failed"; exit 1; }
          echo "PASS"
