name: Test default MPI (mpich)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No mpi input — should default to mpich on Linux
      - name: Assert output mpi equals mpich
        env:
          ACTUAL: ${{ steps.action.outputs.mpi }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "mpich" ]; then
            echo "FAIL: expected 'mpich' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert mpicc is available
        run: |
          which mpicc || { echo "FAIL: mpicc not found on PATH"; exit 1; }
          echo "PASS: mpicc found at $(which mpicc)"
      - name: Assert mpichversion runs
        run: |
          mpichversion || { echo "FAIL: mpichversion failed"; exit 1; }
          echo "PASS"
